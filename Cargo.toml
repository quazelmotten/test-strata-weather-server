[workspace]
members = ["crates/wx-core", "crates/wx-ingest", "crates/wx-server"]
resolver = "2"

[workspace.dependencies]
arc-swap = "^1.7"
memmap2 = "^0.9"
rayon = "^1.10"
notify = "^3.0"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
toml = { version = "^1", features = ["parse", "serde"] }
axum = "^0.7"
tokio = { version = "^1", features = ["full"] }
clap = { version = "^4", features = ["derive"] }
tracing = "^0.1"
smallvec = "^1"
criterion = "^0.5"

# Correctness-safe release tuning per spec §8. NOTE: `target-cpu=native` was
# benchmarked separately (see README); it is NOT enabled here by default so
# deployment binaries stay portable. To try it, uncomment in .cargo/config.toml:
#   [target.x86_64-linux-gnu]
#   rustflags = ["-C", "target-cpu=native"]
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
