[workspace]
members = ["crates/wx-core", "crates/wx-ingest", "crates/wx-server"]
resolver = "2"

[workspace.dependencies]
arc-swap = "^1.7"
memmap2 = "^0.9"
rayon = "^1.10"
notify = "^3.0"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
toml = { version = "^1", features = ["parse", "serde"] }
axum = "^0.7"
tokio = { version = "^1", features = ["full"] }
clap = { version = "^4", features = ["derive"] }
tracing = "^0.1"
smallvec = "^1"
criterion = "^0.5"
# JPEG2000 backend for GRIB2 DRT 5.40. Default features pull in the `image``
# integration (moxcms/pxfm); we only need the decoder itself.
hayro-jpeg2000 = { version = "^0.4.1", default-features = false, features = ["std", "simd"] }
zlib-rs = "^0.6.8"
rust-aec = "^0.1.1"

# Correctness-safe release tuning per spec §8. NOTE: `target-cpu=native` was
# benchmarked separately (see README); it is NOT enabled here by default so
# deployment binaries stay portable. To try it, uncomment in .cargo/config.toml:
#   [target.x86_64-linux-gnu]
#   rustflags = ["-C", "target-cpu=native"]
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Criterion needs unwinding to catch panics inside measured functions, so the
# bench profile mirrors `release` EXCEPT for panic handling (the bench profile
# always unwinds; this cargo ignores `panic` there). Written out explicitly
# because this cargo ignores `inherit` on built-in profiles. `cargo bench`
# builds with this profile; shipped binaries keep panic=abort in release.
[profile.bench]
"opt-level" = 3
lto = "fat"
codegen-units = 1
