# wx-point point-query weather model server — example configuration (spec §3).

[server]
bind = "0.0.0.0:8080"
data_dir = "/var/lib/wxpoint"

[ingest]
scan_interval_secs = 30
retention_runs = 4
# File-stability window: a candidate is eligible once its (size,mtime) has
# stayed unchanged for >= stable_window_secs (default 10). Set 0 to require
# only one re-observation on the next scan round.
#stable_window_secs = 10
# Dedicated rayon decode pool size for ingest work (default 4); kept separate
# from the HTTP runtime so ingest never starves the query path.
#ingest_threads = 4
# How many candidate files are DECODED as ONE chunk before any of them is written
# (V1.2 phase B; default 4, must be >= 1). Cross-file parallelism is preserved INSIDE
# a chunk; peak decode RAM is ~K files; the FIRST queryable output lands after the
# first file of the first chunk instead of after the slowest file of the whole
# directory. K=1 means strictly sequential per-file ingest (lowest RAM, slightly
# later first output); larger K trades RAM for earlier output.
#decode_batch_files = 4
# Provisional wind-pair enforcement (V1.3 phase E3b; default true). The startup
# preflight can only probe files that already exist AND are stable; when a model
# configuring ONLY ONE of UGRD/VGRD later decodes a GRID-relative wind field, the
# ingest thread exits with code 7 (fail-closed, spec §4.4 intent) instead of
# skipping winds + inflating errors forever. Set false to keep the old
# sticky-note-and-skip behavior.
#wind_pair_enforce = true

[[models]]
name = "gfs"
ingest_dir = "/data/incoming/gfs"
file_glob = "gfs.t*z.pgrb2.0p25.f*"

  [[models.params]]
  name = "HGT"
  levels = ["isobaric:1000", "isobaric:925", "isobaric:850", "isobaric:700",
            "isobaric:500", "isobaric:300", "isobaric:250", "isobaric:200"]

  [[models.params]]
  name = "TMP"
  levels = ["height_above_ground:2", "isobaric:*"]

  [[models.params]]
  name = "UGRD"
  levels = ["height_above_ground:10", "isobaric:*"]

  [[models.params]]
  name = "VGRD"
  levels = ["height_above_ground:10", "isobaric:*"]

[[models]]
name = "hrrr"
ingest_dir = "/data/incoming/hrrr"
file_glob = "hrrr.t*z.wrf*f*.grib2"
# Optional per-model sidecar stability strategy: when present, a candidate
# <file> becomes eligible as soon as <file><suffix> exists (upstream writes
# it after closing the GRIB). Overrides the window strategy for this model.
#sidecar_suffix = ".done"

  [[models.params]]
  name = "TMP"
  levels = ["height_above_ground:2", "isobaric:*"]

  # Raw parameter outside the built-in table (spec §3): give the GRIB2
  # discipline/category/number triple instead of a name. The OPTIONAL units
  # key is legal ONLY here — responses must report units (spec §7), and the
  # table cannot supply them for an unknown triple. Setting units on any
  # param the table already resolves (by name OR by an in-table triple) is a
  # hard startup error. A raw param WITHOUT units still boots but logs one
  # loud note per affected entry naming the exact fix.
  #[[models.params]]
  #discipline = 0
  #category = 19
  #number = 5
  #levels = ["surface"]
  #units = "kg/m^2"
